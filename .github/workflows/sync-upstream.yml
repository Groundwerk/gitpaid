name: Sync from upstream

# Manual deploy-sync for Cloudflare-button clones of this repo.
# Clones inherit this file, so each deploy can pull upstream on demand:
# Actions tab -> "Sync from upstream" -> "Run workflow".
# Merges (fast-forwarding when clean); on conflict the clone's side wins
# automatically, so its production config is never clobbered.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream
        run: |
          git remote add upstream https://github.com/Groundwerk/gitpaid.git
          git fetch upstream
          git merge --no-edit -X ours upstream/main
          git push origin main
